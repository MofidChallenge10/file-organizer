<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260" role="img" aria-label="file-organizer">
  <rect width="800" height="260" rx="14" fill="#0b1220"/>
  <text x="400" y="52" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="32" font-weight="bold" fill="#f1f5f9">file-organizer</text>
  <text x="400" y="80" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#94a3b8">messy folder in, tidy folders out</text>

  <!-- falling files -->
  <rect x="188" y="100" width="24" height="24" rx="4" fill="#f472b6">
    <animate attributeName="y" values="100;178" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.8;1" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="388" y="100" width="24" height="24" rx="4" fill="#facc15">
    <animate attributeName="y" values="100;178" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.8;1" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="588" y="100" width="24" height="24" rx="4" fill="#4ade80">
    <animate attributeName="y" values="100;178" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.8;1" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
  </rect>

  <!-- folders -->
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" text-anchor="middle" fill="#0b1220">
    <rect x="150" y="180" width="100" height="60" rx="8" fill="#f472b6"/>
    <text x="200" y="216">Images</text>
    <rect x="350" y="180" width="100" height="60" rx="8" fill="#facc15"/>
    <text x="400" y="216">Docs</text>
    <rect x="550" y="180" width="100" height="60" rx="8" fill="#4ade80"/>
    <text x="600" y="216">Code</text>
  </g>
</svg>
